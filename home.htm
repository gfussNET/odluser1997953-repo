<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dungeon Entrance</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #8b0000;
            text-shadow: 2px 2px #000;
        }
        .door-container {
            border: 5px solid #444;
            box-shadow: 0 0 20px #000;
            max-width: 400px;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
        }
        p {
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Beware: The Dungeon Awaits</h1>

    <div class="door-container">
        <img src="dungeon-door.png" alt="A heavy wooden dungeon door with iron hinges">
    </div>

    <p>Only the brave (or those with the right IAM permissions) may enter.</p>

</body>
</html>
